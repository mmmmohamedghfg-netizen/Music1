name: Build MusicWave Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Uploaded Project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE - extracting..."
            unzip -o "$ZIP_FILE" -d .
          else
            echo "No ZIP file found in root directory!"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicWave-Pro-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/*.apk ./MusicWave-Pro.apk
          gh release delete v3.0.0 --cleanup-tag -y || true
          gh release create v3.0.0 ./MusicWave-Pro.apk \
            --target "${{ github.sha }}" \
            --title "MusicWave Pro v3.0 Ultimate APK" \
            --notes "الإصدار الثالث مع السحب والإفلات، حفظ الإعدادات الدائم، 6 ثيمات بأيقونات مستقلة، و6 مؤثرات بصرية واقعية"
          echo "=========================================="
          echo "رابط تحميل التطبيق المباشر:"
          echo "https://github.com/${{ github.repository }}/releases/download/v3.0.0/MusicWave-Pro.apk"
          echo "=========================================="
