name: Build MusicWave Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Uploaded Project ZIP and Fix Line 291
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE - extracting..."
            unzip -o "$ZIP_FILE" -d .
          else
            echo "No ZIP file found in root directory!"
            exit 1
          fi
          sed -i 's/"إضافة "${targetSong.title}" إلى قائمة"/"إضافة (${targetSong.title}) إلى قائمة"/g' app/src/main/java/com/musicwave/pro/ui/MusicWaveApp.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicWave-Pro-APK
          path: app/build/outputs/apk/debug/*.apk
          
